# Render Blueprint — Koola10 Emergent Studio
# Deploy both services in one click: Render dashboard → New → Blueprint → point at
# the koola10-emergent-studio-app repo. Then fill in GEMINI_API_KEY (and optionally
# DATABASE_URL) on the koola10-studio-api service and redeploy.
# NOTE: service hostnames below assume Render assigns the default
# <service-name>.onrender.com URLs. If you rename a service, update the matching URL.
services:
  - type: web
    name: koola10-studio-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://koola10-studio-app.onrender.com

  - type: web
    name: koola10-studio-app
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://koola10-studio-api.onrender.com
